services:
  postgres:
    image: postgres:17-alpine
    container_name: sbg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbg_password}
      POSTGRES_DB: ${POSTGRES_DB:-sbg}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
